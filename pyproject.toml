[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-rag"
version = "0.1.0"
description = "Retrieval-augmented runbook search with FAISS, cited answers and retrieval evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Darpen24"}]
dependencies = ['langchain>=1.0,<2', 'langchain-core>=1.0,<2', 'langchain-text-splitters>=1.0,<2', 'faiss-cpu>=1.8,<2', 'numpy>=1.26,<3', 'python-dotenv>=1,<2']

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
openai = ["langchain-openai>=1,<2"]
anthropic = ["langchain-anthropic>=1,<2"]

[project.scripts]
runbook-rag = "runbook_rag.cli:main"

[project.urls]
Repository = "https://github.com/Darpen24/runbook-rag"
Issues = "https://github.com/Darpen24/runbook-rag/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runbook_rag = ["resources/data/*.jsonl", "resources/data/docs/*.md", "resources/data/runbooks/*.md", "resources/prompts/*/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
